<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Control Portón BLE</title>
</head>
<body>

<h2>Control Portón Sumobot BLE</h2>

<button onclick="conectar()">Conectar BLE</button>
<br><br>

<p id="estado">Estado: Desconectado</p>

<button onclick="abrir()">Abrir Portón</button>
<button onclick="cerrar()">Cerrar Portón</button>

<script>
let device;
let characteristic;

async function conectar() {
    try {
        device = await navigator.bluetooth.requestDevice({
            filters: [{ name: "Porton_Sumobot" }],
            optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e'] // UUID Nordic UART
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');

        // TX (robot envía datos)
        const tx = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
        await tx.startNotifications();
        tx.addEventListener('characteristicvaluechanged', recibirDatos);

        // RX (enviar datos al robot)
        characteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');

        document.getElementById("estado").innerText = "Estado: Conectado";

    } catch (error) {
        alert("Error al conectar: " + error);
    }
}

function recibirDatos(event) {
    let valor = new TextDecoder().decode(event.target.value);
    console.log("Recibido:", valor);

    if (valor.includes("OBJETO_DETECTADO")) {
        document.getElementById("estado").innerText = "🚨 Objeto Detectado";
    }

    if (valor.includes("AREA_LIBRE")) {
        document.getElementById("estado").innerText = "Área libre";
    }
}

async function abrir() {
    if (characteristic) {
        await characteristic.writeValue(new TextEncoder().encode("ABRIR\n"));
    }
}

async function cerrar() {
    if (characteristic) {
        await characteristic.writeValue(new TextEncoder().encode("CERRAR\n"));
    }
}
</script>

</body>
</html>
