<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ServoBLE - Control IoT</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}

.container{
    margin-top:60px;
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

.status{
    margin:20px auto;
    width:200px;
    height:200px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
    background:#333;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.connected{
    background:#00c853;
    box-shadow:0 0 30px #00ff88;
}

.detected{
    background:#d50000;
    box-shadow:0 0 40px #ff1744;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

button{
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.connect-btn{
    background:#2979ff;
    color:white;
}

.connect-btn:hover{
    background:#5393ff;
}

.open-btn{
    background:#00c853;
    color:white;
}

.close-btn{
    background:#d50000;
    color:white;
}

button:hover{
    transform:scale(1.05);
}

footer{
    margin-top:50px;
    opacity:0.6;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">
    <h1>🔵 ServoBLE Control</h1>
    <p>Sistema IoT con IdeaBoard + BLE</p>

    <div id="statusCircle" class="status">
        Desconectado
    </div>

    <button class="connect-btn" onclick="conectar()">Conectar BLE</button>
    <br>
    <button class="open-btn" onclick="abrir()">Abrir Portón</button>
    <button class="close-btn" onclick="cerrar()">Cerrar Portón</button>
</div>

<footer>
    © 2025 ServoBLE | Proyecto IoT CENFOTEC
</footer>

<script>
let device;
let characteristic;
let statusCircle = document.getElementById("statusCircle");

async function conectar(){
    try{
        device = await navigator.bluetooth.requestDevice({
            filters:[{name:"Porton_Sumobot"}],
            optionalServices:['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');

        const tx = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
        await tx.startNotifications();
        tx.addEventListener('characteristicvaluechanged', recibirDatos);

        characteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');

        statusCircle.innerText="Conectado";
        statusCircle.classList.add("connected");

    }catch(error){
        alert("Error: "+error);
    }
}

function recibirDatos(event){
    let valor = new TextDecoder().decode(event.target.value);

    if(valor.includes("OBJETO_DETECTADO")){
        statusCircle.innerText="OBJETO DETECTADO";
        statusCircle.classList.remove("connected");
        statusCircle.classList.add("detected");
    }

    if(valor.includes("AREA_LIBRE")){
        statusCircle.innerText="Área Libre";
        statusCircle.classList.remove("detected");
        statusCircle.classList.add("connected");
    }
}

async function abrir(){
    if(characteristic){
        await characteristic.writeValue(new TextEncoder().encode("ABRIR\n"));
    }
}

async function cerrar(){
    if(characteristic){
        await characteristic.writeValue(new TextEncoder().encode("CERRAR\n"));
    }
}
</script>

</body>
</html>
