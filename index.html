<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1720">

<title>ServoBLE - Control IoT</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    -webkit-text-size-adjust:100%;
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));

    font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;

    background:
        radial-gradient(circle at top,#29435d 0%,#172433 40%,#0f1720 100%);

    color:white;
}

.container{

    width:min(95%,500px);

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.10);

    border-radius:30px;

    padding:35px 25px;

    backdrop-filter:blur(14px);

    -webkit-backdrop-filter:blur(14px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.40);

    text-align:center;
}

h1{

    font-size:clamp(30px,6vw,42px);

    margin-bottom:8px;

    letter-spacing:.5px;
}

.subtitle{

    color:#b7c9db;

    font-size:clamp(14px,3vw,17px);

    margin-bottom:25px;
}

.status{

    width:clamp(180px,48vw,240px);

    height:clamp(180px,48vw,240px);

    margin:auto;

    border-radius:50%;

    background:#252525;

    border:4px solid #555;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;

    font-size:clamp(18px,4vw,22px);

    font-weight:bold;

    transition:.35s;

    word-break:break-word;
}

.connected{

    background:#00c853;

    border-color:#5cff8d;

    box-shadow:
        0 0 18px #00ff88,
        0 0 40px rgba(0,255,136,.4);
}

.detected{

    background:#ff1744;

    border-color:#ff6682;

    box-shadow:
        0 0 18px #ff1744,
        0 0 45px rgba(255,23,68,.5);

    animation:pulse 1s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }

    100%{
        transform:scale(1);
    }
}

button{

    width:100%;

    border:none;

    border-radius:40px;

    padding:16px;

    margin-top:15px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    transition:.25s;
}

button:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 22px rgba(255,255,255,.15);
}

button:active{

    transform:scale(.97);
}

.connect-btn{

    background:linear-gradient(135deg,#2979ff,#00c6ff);
}

.actions{

    display:flex;

    gap:12px;

    margin-top:12px;
}

.open-btn{

    background:linear-gradient(135deg,#00c853,#64dd17);
}

.close-btn{

    background:linear-gradient(135deg,#d50000,#ff1744);
}

.info{

    margin-top:22px;

    font-size:15px;

    color:#d0d8df;

    min-height:22px;
}

footer{

    margin-top:30px;

    color:#91a3b4;

    font-size:14px;
}

@media(max-width:480px){

    .container{

        padding:25px 18px;
    }

    .actions{

        flex-direction:column;
    }

}
</style>

</head>

<body>

<div class="container">

    <h1>🔵 ServoBLE</h1>

    <p class="subtitle">
        Control IoT • IdeaBoard ESP32 • Bluetooth Low Energy
    </p>

    <div id="statusCircle" class="status">
        Desconectado
    </div>

    <button class="connect-btn" onclick="conectar()">
        🔗 Conectar BLE
    </button>

    <div class="actions">

        <button class="open-btn" onclick="abrir()">
            🟢 Abrir Portón
        </button>

        <button class="close-btn" onclick="cerrar()">
            🔴 Cerrar Portón
        </button>

    </div>

    <p id="log" class="info">
        Esperando conexión...
    </p>

    <footer>
        © 2026 ServoBLE
    </footer>

</div>

<script>

let device;
let characteristic;

const statusCircle=document.getElementById("statusCircle");
const log=document.getElementById("log");

let buffer="";

async function conectar(){

    try{

        device=await navigator.bluetooth.requestDevice({

            filters:[
                {
                    name:"Porton_Sumobot"
                }
            ],

            optionalServices:[
                "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
            ]

        });

        device.addEventListener(
            "gattserverdisconnected",
            desconectado
        );

        const server=await device.gatt.connect();

        const service=await server.getPrimaryService(
            "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
        );

        const tx=await service.getCharacteristic(
            "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
        );

        await tx.startNotifications();

        tx.addEventListener(
            "characteristicvaluechanged",
            recibirDatos
        );

        characteristic=await service.getCharacteristic(
            "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
        );

        statusCircle.innerHTML="✅<br>Conectado";

        statusCircle.classList.add("connected");

        statusCircle.classList.remove("detected");

        log.innerHTML="Bluetooth conectado correctamente.";

    }

    catch(error){

        alert("Error al conectar:\n\n"+error);

    }

}

function desconectado(){

    statusCircle.innerHTML="Desconectado";

    statusCircle.classList.remove("connected");

    statusCircle.classList.remove("detected");

    log.innerHTML="Bluetooth desconectado.";

}

function recibirDatos(event){

    const chunk=new TextDecoder().decode(event.target.value);

    buffer+=chunk;

    if(!buffer.includes("\n")) return;

    const mensajes=buffer.split("\n");

    for(let mensaje of mensajes){

        mensaje=mensaje.trim();

        console.log(mensaje);

        if(mensaje==="OBJETO_DETECTADO"){

            statusCircle.innerHTML="🚨<br>Objeto Detectado";

            statusCircle.classList.remove("connected");

            statusCircle.classList.add("detected");

            log.innerHTML="Sensor ultrasónico detectó un objeto.";

        }

        else if(mensaje==="AREA_LIBRE"){

            statusCircle.innerHTML="✅<br>Área Libre";

            statusCircle.classList.remove("detected");

            statusCircle.classList.add("connected");

            log.innerHTML="No hay objetos detectados.";

        }

        else if(mensaje==="PORTON_ABIERTO"){

            log.innerHTML="🚪 Portón abierto.";

        }

        else if(mensaje==="PORTON_CERRADO"){

            log.innerHTML="🔒 Portón cerrado.";

        }

    }

    buffer="";

}

async function abrir(){

    if(!characteristic){

        alert("Primero conecta el Bluetooth.");

        return;

    }

    await characteristic.writeValue(

        new TextEncoder().encode("ABRIR\n")

    );

}

async function cerrar(){

    if(!characteristic){

        alert("Primero conecta el Bluetooth.");

        return;

    }

    await characteristic.writeValue(

        new TextEncoder().encode("CERRAR\n")

    );

}

</script>

</body>
</html>
